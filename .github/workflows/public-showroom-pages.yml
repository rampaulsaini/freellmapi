name: Deploy public showroom to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public-showroom/**"
      - "scripts/build-public-showroom.mjs"
      - ".github/workflows/public-showroom-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-showroom-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static showroom
        env:
          SHOWROOM_SUPABASE_URL: ${{ vars.SHOWROOM_SUPABASE_URL }}
          SHOWROOM_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SHOWROOM_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/build-public-showroom.mjs
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-showroom

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
